version: 0.2

env:
  variables:
    AWS_REGION: "eu-central-1"

phases:
  install:
    runtime-versions:
      java: corretto21
      nodejs: 22
    commands:
      - echo "Using Java:"
      - java -version
      - echo "Using Node:"
      - node --version
      - echo "Using Docker:"
      - docker --version

  pre_build:
    commands:
      - echo "Preparing Amazon ECR authentication..."

      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - echo "Image tag = $IMAGE_TAG"

  build:
    commands:
      - echo "Building Eureka Server..."
      - mvn -B -DskipTests package -f backend/eureka-server/pom.xml

      - echo "Building API Gateway..."
      - mvn -B -DskipTests package -f backend/api-gateway/pom.xml

      - echo "Building User Service..."
      - mvn -B -DskipTests package -f backend/user-service/pom.xml

      - echo "Building Task Service..."
      - mvn -B -DskipTests package -f backend/task-service/pom.xml

      - echo "Building AI Service..."
      - mvn -B -DskipTests package -f backend/ai-service/pom.xml

      - echo "Building Angular frontend..."
      - cd frontend
      - npm ci
      - npm run build
      - cd ..

      - echo "Building Docker images..."

      - docker build -t $ECR_REGISTRY/smarttask/eureka-server:$IMAGE_TAG backend/eureka-server
      - docker build -t $ECR_REGISTRY/smarttask/api-gateway:$IMAGE_TAG backend/api-gateway
      - docker build -t $ECR_REGISTRY/smarttask/user-service:$IMAGE_TAG backend/user-service
      - docker build -t $ECR_REGISTRY/smarttask/task-service:$IMAGE_TAG backend/task-service
      - docker build -t $ECR_REGISTRY/smarttask/ai-service:$IMAGE_TAG backend/ai-service

      - echo "Tagging Docker images as latest..."

      - docker tag $ECR_REGISTRY/smarttask/eureka-server:$IMAGE_TAG $ECR_REGISTRY/smarttask/eureka-server:latest
      - docker tag $ECR_REGISTRY/smarttask/api-gateway:$IMAGE_TAG $ECR_REGISTRY/smarttask/api-gateway:latest
      - docker tag $ECR_REGISTRY/smarttask/user-service:$IMAGE_TAG $ECR_REGISTRY/smarttask/user-service:latest
      - docker tag $ECR_REGISTRY/smarttask/task-service:$IMAGE_TAG $ECR_REGISTRY/smarttask/task-service:latest
      - docker tag $ECR_REGISTRY/smarttask/ai-service:$IMAGE_TAG $ECR_REGISTRY/smarttask/ai-service:latest

      - echo "Pushing Docker images to Amazon ECR..."

      - docker push $ECR_REGISTRY/smarttask/eureka-server:$IMAGE_TAG
      - docker push $ECR_REGISTRY/smarttask/eureka-server:latest

      - docker push $ECR_REGISTRY/smarttask/api-gateway:$IMAGE_TAG
      - docker push $ECR_REGISTRY/smarttask/api-gateway:latest

      - docker push $ECR_REGISTRY/smarttask/user-service:$IMAGE_TAG
      - docker push $ECR_REGISTRY/smarttask/user-service:latest

      - docker push $ECR_REGISTRY/smarttask/task-service:$IMAGE_TAG
      - docker push $ECR_REGISTRY/smarttask/task-service:latest

      - docker push $ECR_REGISTRY/smarttask/ai-service:$IMAGE_TAG
      - docker push $ECR_REGISTRY/smarttask/ai-service:latest

  post_build:
    commands:
      - |
        if [ "$CODEBUILD_BUILD_SUCCEEDING" -ne 1 ]; then
          echo "Build failed. Skipping deployment preparation."
          exit 1
        fi

      - echo "Creating ECS deployment definitions..."

      - |
        printf '[{"name":"eureka-server","imageUri":"%s"}]' \
        "$ECR_REGISTRY/smarttask/eureka-server:$IMAGE_TAG" \
        > imagedefinitions-eureka.json

      - |
        printf '[{"name":"user-service","imageUri":"%s"}]' \
        "$ECR_REGISTRY/smarttask/user-service:$IMAGE_TAG" \
        > imagedefinitions-user.json

      - |
        printf '[{"name":"task-service","imageUri":"%s"}]' \
        "$ECR_REGISTRY/smarttask/task-service:$IMAGE_TAG" \
        > imagedefinitions-task.json

      - |
        printf '[{"name":"ai-service","imageUri":"%s"}]' \
        "$ECR_REGISTRY/smarttask/ai-service:$IMAGE_TAG" \
        > imagedefinitions-ai.json

      - |
        printf '[{"name":"api-gateway","imageUri":"%s"}]' \
        "$ECR_REGISTRY/smarttask/api-gateway:$IMAGE_TAG" \
        > imagedefinitions-gateway.json

      - echo "Deploying Angular frontend to S3..."
      - aws s3 sync frontend/dist/frontend/browser s3://smarttask-frontend-2026-01 --delete

      - echo "Invalidating CloudFront cache..."
      - aws cloudfront create-invalidation --distribution-id E3T2FWSF0SBMNM --paths "/*"

      - echo "SmartTask CI/CD build completed successfully."

artifacts:
  files:
    - imagedefinitions-eureka.json
    - imagedefinitions-user.json
    - imagedefinitions-task.json
    - imagedefinitions-ai.json
    - imagedefinitions-gateway.json
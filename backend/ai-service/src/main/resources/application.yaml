spring:
  application:
    name: ai-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/smarttask}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/smarttask/protocol/openid-connect/certs}

      client:
        registration:
          ai-service:
            provider: keycloak
            client-id: ai-service
            client-secret: ${AI_SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials

        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/smarttask/protocol/openid-connect/token}

  ai:
    model:
      chat: google-genai

    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-3.6-flash

server:
  port: 8083

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}

  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

services:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8081}

  task-service:
    url: ${TASK_SERVICE_URL:http://localhost:8082}
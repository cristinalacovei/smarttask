spring:
  application:
    name: task-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/smarttask}
    username: ${DB_USERNAME:smarttask}
    password: ${DB_PASSWORD:smarttask}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/smarttask}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/smarttask/protocol/openid-connect/certs}

      client:
        registration:
          task-service:
            provider: keycloak
            client-id: task-service
            client-secret: ${TASK_SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials

        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/smarttask/protocol/openid-connect/token}


server:
  port: 8082


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}


services:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8081}